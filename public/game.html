<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <title>Vacuum Panic! — Daily Cat Dash</title>
    <link rel="modulepreload" href="game.js">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #17102a;
        font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
        color: #fdf6e9;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(900px 600px at 50% 30%, #2c2145 0%, #17102a 65%);
      }
      canvas {
        display: block;
        border-radius: 10px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 0 2px #54355c;
        touch-action: none;
      }
      #daily-panel {
        flex: 0 0 auto;
        max-height: 32dvh;
        overflow-y: auto;
        padding: 8px 14px 10px;
        background: rgba(16, 10, 30, .92);
        border-top: 2px solid #54355c;
        font-size: 14px;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-weight: bold;
        color: #ffb03a;
      }
      .panel-head .streak { color: #ff7eb6; }
      .panel-note { color: #cdb9dd; margin-top: 2px; }
      .panel-rows { margin: 6px 0 0; padding-left: 0; list-style: none; }
      .panel-rows li {
        display: flex;
        justify-content: space-between;
        padding: 1px 0;
        color: #fdf6e9;
      }
      .panel-you { margin-top: 4px; font-weight: bold; color: #2fe08a; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game" width="960" height="540"></canvas></div>
    <div id="daily-panel" aria-live="polite"></div>
    <script src="game.js" type="module"></script>
  </body>
</html>
